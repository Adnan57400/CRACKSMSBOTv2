[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:whatsapp]
command=node whatsapp_otp.js
autostart=true
autorestart=true
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bot]
command=python bot.py
autostart=true
autorestart=true
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
